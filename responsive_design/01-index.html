<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techium — Homepage</title>
    <link rel="stylesheet" href="01-styles.css">
  </head>
  <body>
    <header class="header">
      <div class="header-container">
        <a href="#" class="header-logo">Techium</a>
        <input class="menu-btn" type="checkbox" id="menu-btn">
        <label class="menu-icon" for="menu-btn">
          <span class="navicon"></span>
        </label>
        <nav class="navbar-menu">
          <ul class="nav">
            <li class="nav-item"><a href="#">Home</a></li>
            <li class="nav-item"><a href="#">About</a></li>
            <li class="nav-item"><a href="#">Services</a></li>
            <li class="nav-item"><a href="#">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section class="section-hero hero-homepage">
        <div class="section-inner">
          <div class="section-body">
            <h1>Homepage</h1>
            <p>Welcome to our website.</p>
          </div>
        </div>
      </section>

      <section class="section section-about">
        <div class="container">
          <header class="section-header">
            <h2>About</h2>
          </header>
          <div class="section-body">
            <img src="images/pic-about-01.jpg" alt="About us" class="img-fluid">
          </div>
        </div>
      </section>

      <section class="section section-latest-news">
        <div class="container">
          <header class="section-header">
            <h2>Latest news</h2>
          </header>
          <div class="row">
            <div class="col-1-3">
              <article class="card-blog">
                <img src="images/pic-article-01.jpg" alt="Article 1">
                <h3>Article 1</h3>
                <p>Lorem ipsum dolor sit amet.</p>
              </article>
            </div>
            <div class="col-1-3">
              <article class="card-blog">
                <img src="images/pic-article-02.jpg" alt="Article 2">
                <h3>Article 2</h3>
                <p>Lorem ipsum dolor sit amet.</p>
              </article>
            </div>
            <div class="col-1-3">
              <article class="card-blog">
                <img src="images/pic-article-03.jpg" alt="Article 3">
                <h3>Article 3</h3>
                <p>Lorem ipsum dolor sit amet.</p>
              </article>
            </div>
          </div>
        </div>
      </section>

      <section class="section section-works">
        <div class="container">
          <header class="section-header">
            <h2>Works</h2>
          </header>
          <div class="row">
            <div class="col-1-2">
              <article class="card-work">
                <div class="card-inner">
                  <h3 class="card-title"><a href="#">Work 1</a></h3>
                </div>
              </article>
            </div>
            <div class="col-1-2">
              <article class="card-work">
                <div class="card-inner">
                  <h3 class="card-title"><a href="#">Work 2</a></h3>
                </div>
              </article>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <ul class="social nav">
          <li><a href="#">Facebook</a></li>
          <li><a href="#">Twitter</a></li>
        </ul>
        <ul class="footer-nav">
          <li><a href="#">Home</a></li>
          <li><a href="#">Terms</a></li>
        </ul>
      </div>
    </footer>
  </body>
</html>
